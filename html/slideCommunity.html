<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    html,
    body {
      position: relative;
      height: 100%;
    }


    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      text-align: center;
      font-size: 18px;
      width: px;
      height: 300px;
      background: none;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
    }

    .swiper-slide .thumbnail {
      border-radius: 20px;
      display: block;
      width: 220px;
      height: 300px;
      object-fit: cover;
    }

    .swiper {
      width: 1200px;
      height: 320px;
      margin: 20px auto;
    }

    .append-buttons {
      text-align: center;
      margin-top: 20px;
    }

    .append-buttons button {
      display: inline-block;
      cursor: pointer;
      border: none;
      color: none;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 4px;
      margin: 0 10px;
      font-size: 13px;
      visibility: transparent;
    }

    .swiper-button-next:after, .swiper-button-prev:after{
      visibility: hidden;
    }
    
    .swiper-button-prev {
      padding-left: 25px;
    }

    .thumbnail {
      position: relative;
    }

    .profile-id-wrapper {
      width: 194px;
      height: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      bottom: 18px;
      left: 18px;
    }

    .profile-id img {
      display: flex;
      flex-wrap: wrap;
      width: 40px;
      height: 40px;
    }

    .like-buttons {
      width: 20px;
      height: 20px;
      display: flex;
      flex-wrap: wrap;
    }

    .like-button {
      width: 20px;
      height: 20px;
      position: relative;
      cursor: pointer;
    }

    .liked-button {
      width: 20px;
      height: 20px;
      position: absolute;
      display: none;
      cursor: pointer;
    }

    
    .profile-id {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100px;
      height: 40px;
    }

    

    .profile-id-wrapper p{
      color: #FFFFFF;
      align-items: center;
    }

    .disable {
      display: none;
    }

    .enable {
      display: flex;
    }
   

  </style>
</head>

<body>
  <!-- Swiper -->

  <div #swiperRef="" class="swiper mySwiper2">
    <ul class="swiper-wrapper">
      <li class="swiper-slide">
        <a href="#">
          <img class="thumbnail" src="/powpowcommunity/images/dog5.png" alt="다른 사람 글 1">
          <div class="profile-id-wrapper">
            <div class="profile-id">
              <img src="/powpowcommunity/images/profileimage.png" alt="프사1">
              <p class="h5">아이디</p>
            </div>
          </a>
            <div class="like-buttons">
              <img class="like-button enabled" src="/powpowcommunity/images/likebutton.png" alt="좋아요">
              <img class="liked-button disabled" src="/powpowcommunity/images/8666647_heart_icon 4_filled_yellow.png" alt="좋아요 눌림">
            </div>
          </div>
      </li>
      <li class="swiper-slide">
        <a href="#">
          <img class="thumbnail" src="/powpowcommunity/images/cat3.png" alt="다른 사람 글 2">
          <div class="profile-id-wrapper">
            <div class="profile-id">
              <img src="/powpowcommunity/images/profileimage2.png" alt="프사2">
              <p class="h5">아이디</p>
            </div>
          </a>
            <div class="like-buttons">
              <img class="like-button enabled" src="/powpowcommunity/images/likebutton.png" alt="좋아요">
              <img class="liked-button disabled" src="/powpowcommunity/images/8666647_heart_icon 4_filled_yellow.png" alt="좋아요 눌림">
            </div>
          </div>
      </li>
      <li class="swiper-slide">
        <a href="#">
          <img class="thumbnail" src="/powpowcommunity/images/dog6.png" alt="다른 사람 글 3">
          <div class="profile-id-wrapper">
            <div class="profile-id">
              <img src="/powpowcommunity/images/profileimage3.png" alt="프사3">
              <p class="h5">아이디</p>
            </div>
          </a>
            <div class="like-buttons">
              <img class="like-button enabled" src="/powpowcommunity/images/likebutton.png" alt="좋아요">
              <img class="liked-button disabled" src="/powpowcommunity/images/8666647_heart_icon 4_filled_yellow.png" alt="좋아요 눌림">
            </div>
          </div>
      </li>
      <li class="swiper-slide">
        <a href="#">
          <img class="thumbnail" src="/powpowcommunity/images/fish2.png" alt="다른 사람 글 4">
          <div class="profile-id-wrapper">
            <div class="profile-id">
              <img src="/powpowcommunity/images/profileimage4.png" alt="프사4">
              <p class="h5">아이디</p>
            </div>
          </a>
            <div class="like-buttons">
              <img class="like-button enabled" src="/powpowcommunity/images/likebutton.png" alt="좋아요">
              <img class="liked-button disabled" src="/powpowcommunity/images/8666647_heart_icon 4_filled_yellow.png" alt="좋아요 눌림">
            </div>
          </div>
      </li>
      <li class="swiper-slide">
        <img class="thumbnail" src="/powpowcommunity/images/bird2.png" alt="다른 사람 글 5">
        <div class="profile-id-wrapper">
          <div class="profile-id">
            <img src="/powpowcommunity/images/profileimage5.png" alt="프사5">
            <p class="h5">아이디</p>
          </div>
          <div class="like-buttons">
            <img class="like-button enabled" src="/powpowcommunity/images/likebutton.png" alt="좋아요">
            <img class="liked-button disabled" src="/powpowcommunity/images/8666647_heart_icon 4_filled_yellow.png" alt="좋아요 눌림">
          </div>
        </div>
      </li>
      <li class="swiper-slide">
        <img class="thumbnail" src="/powpowcommunity/images/dog5.png" alt="다른 사람 글 6">
        <div class="profile-id-wrapper">
          <div class="profile-id">
            <img src="/powpowcommunity/images/profileimage.png" alt="프사6">
            <p class="h5">아이디</p>
          </div>
          <div class="like-buttons">
            <img class="like-button enabled" src="/powpowcommunity/images/likebutton.png" alt="좋아요">
            <img class="liked-button disabled" src="/powpowcommunity/images/8666647_heart_icon 4_filled_yellow.png" alt="좋아요 눌림">
          </div>
        </div>
      </li>
      
      
      
      
      
    </ul>
    <div class="swiper-button-next">
      <img src="/powpowcommunity/images/버튼.png" alt="우측 버튼">
    </div>
    <div class="swiper-button-prev">
      <img src="/powpowcommunity/images/왼쪽 버튼.png" alt="좌측 버튼">
    </div>
    <div class="swiper-pagination"></div>
  </div>



  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Initialize Swiper -->
  <script>
    var swiper = new Swiper(".mySwiper2", {
      slidesPerView: 5,
    
      spaceBetween: 10,
     
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      }
    });

  </script>

  <script>

     //좋아요 버튼 토글하기

  const likeButton = document.querySelector(".like-button");
  const likedButton = document.querySelector(".liked-button");

  likeButton.addEventListener("click", () => {
      likedButton.className = "liked-button enable";
      likeButton.className = "like-button disable";
    
  })

  likedButton.addEventListener("click", () => {
      likedButton.className = "liked-button disable";
      likeButton.className = "like-button enable";
    
  })



  
  </script>


</body>

</html>
