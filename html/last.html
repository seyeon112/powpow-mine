<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>멀티이미지</title>
  <style>

    /* 더미데이터 */
    .main-img-dummy {
      display: block;
      width: 400px;
      height: 400px;
      border: solid 1px #333;
      background-repeat: no-repeat;
      background-size: cover;
    }
    
    .sub-images-wrap-dummy{
      display: flex;
    }
    
    .sub-img-dummy {
      display: block;
      width: 100px;
      height: 100px;
      border: solid 1px #333;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* 실제 이미지 */
    #main-content-wrap{
      display: none;
    }

    .main-image{
      position: relative;
      width: 400px; 
    }
    .main-img {
      display: block;
      width: 400px;
      height: 400px;
      border: solid 1px #333;
      background-repeat: no-repeat;
      background-size: cover;
    }
    
    .sub-images-wrap{
      display: flex;
    }
    
    .sub-img {
      display: block;
      width: 100px;
      height: 100px;
      border: solid 1px #333;
      background-repeat: no-repeat;
      background-size: cover;
    }

    #file-upload {
      display: none;
    }

    .tag-button {
      position: absolute;
      bottom : 15%;
      left: 50%;
      transform: translate(-50%, 0);
    }

    .tag-popup{
      display: none;
      width: 200px;
      height: 200px;
      position: absolute;
      background-color: white;
      border: solid 1px red;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <!-- 디자인 용 -->
  <div id="dummy-content-wrap">
    <div class="main-image-dummy">
      <label for="file-upload">
        <div class="main-img-dummy"></div>
      </label>
    </div>
    <div class="sub-images-wrap-dummy">
      <div class="sub-img-dummy"></div>
      <div class="sub-img-dummy"></div>
      <div class="sub-img-dummy"></div>
      <div class="sub-img-dummy"></div>
    </div>
    <input id="file-upload" type="file" multiple>
  </div>

  <!-- 실제 이미지가 보여지는 곳 -->
  <div id="main-content-wrap">
    <div class="main-image">
        <div class="main-img image"></div>
        <button class="tag-button">태그 추가 버튼</button>
        <div class="tag-popup">
          <p>태그 할 위치에 클릭해주세요!</p>
          <button onclick="cancel()">위치 다시 선택</button>
        </div>
    </div>
    <div class="sub-images-wrap">
      <div class="sub-img image"></div>
      <div class="sub-img image"></div>
      <div class="sub-img image"></div>
      <div class="sub-img image"></div>
    </div>
    <input id="file-upload" type="file" multiple>
  </div>

</body>
<script>
  const files = document.querySelector("input");
  const images = document.querySelectorAll(".image");
  const dummyContent = document.querySelector("#dummy-content-wrap");
  const mainContent = document.querySelector("#main-content-wrap");
  const mainImage = document.querySelector(".main-image");
  const tagPopup = document.querySelector(".tag-popup");
  const tagbutton = document.querySelector(".tag-button");

  console.log(mainImage)
  files.addEventListener("change", (e) => {
    const uploadFiles = Array.from(e.target.files);

    for(let i = 0; i < uploadFiles.length; i++){
      let reader = new FileReader();
      reader.readAsDataURL(e.target.files[i])
      reader.onload = (e) => {
        console.log(e)
        images[i].style.backgroundImage = `url(${e.target.result})`;
        dummyContent.style.display = "none";
        mainContent.style.display = "block";
      } 
    }    
  })
  // 이미지를 클릭하면 태그 박스를 삽입
  
  tagbutton.addEventListener("click", (e) => {
    e.target.style.display = "none";
    tagPopup.style.display = "block";
  })

  globalThis.count = 0;
  mainImage.addEventListener("click", (e) => {
    const firstLayerX = e.layerX;
    const firstLayerY = e.layerY;
    count++
    console.log(count)
   

    if(count == 2){
      tagPopup.style.left = `${e.layerX}px`;
      tagPopup.style.top = `${e.layerY}px`;
    }else{
      return;
    }

  })

  const cancel = () => { count = 0; return; }

</script>
</html>
