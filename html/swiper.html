<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <!-- <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    /> -->
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #eee;
        color: #000;
        margin: 0;
        padding: 0;
      }

      .swiper-container {
        position: relative;
        width: 100%;
        height: 250px;
      }

      .swiper-slide {
        display: -webkit-box;
        display: -ms-flexbox;
        display: -webkit-flex;
        display: flex;
        -webkit-box-pack: center;
        -ms-flex-pack: center;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-box-align: center;
        -ms-flex-align: center;
        -webkit-align-items: center;
        align-items: center;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: relative;
      }

      .swiper-button {
        background-color: transparent;
      }

      .post-info {
        width: 250px;
        height: 250px;
        display: flex;
        flex-wrap: wrap;
        position: absolute;
        top: 0%;
      }




      
    </style>
  </head>

  <body>
    <!-- Swiper -->
    <div class="swiper-container mySwiper">
      <ul class="swiper-wrapper">
        <li class="swiper-slide">
          <a href="#"><img src="/powpowcommunity/images/sportsevent.png" alt="포스팅 1">
           
          </a>
        </li>
        <li class="swiper-slide">
          <a href="#"><img src="/powpowcommunity/images/sportsevent2.png" alt="포스팅 2">
            
          </a>
        </li>
        <li class="swiper-slide">
          <a href="#"><img src="/powpowcommunity/images/sportsevent3.png" alt="포스팅 3">
          
        </a></li>
        <li class="swiper-slide">
          <a href="#"><img src="/powpowcommunity/images/sportsevent4.png" alt="포스팅 4">
            
          </a>
        </li>
        <li class="swiper-slide">
          <a href="#"><img src="/powpowcommunity/images/sportsevent5.png" alt="포스팅 5">
           
          </a>
        </li>
        <li class="swiper-slide">
          <a href="#"><img src="/powpowcommunity/images/sportsevent6.png" alt="포스팅 6">
          </a>
        </li>
        
      </ul>
      <div class="swiper-button">
        <div class="swiper-button-next">
          <img src="/powpowcommunity/images/버튼.png" alt="오른쪽 버튼">
        </div>
        <div class="swiper-button-prev">
          <img src="/powpowcommunity/images/왼쪽 버튼.png" alt="왼쪽 버튼">
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        slidesPerView: 5,
        spaceBetween: 20,
        slidesPerGroup: 1,
        // pagination: {
        //   el: ".swiper-pagination",
        //   clickable: true,
        // },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });


      //좋아요 버튼 전체적용

      const swipers = document.querySelector(".swiper-wrapper")
      const swipersList = document.querySelectorAll(".swiper-slide")
      const swipersLike = document.querySelectorAll(".like-button");

      console.log(swipersLike)
      
      





      
      
      //좋아요 버튼 바꾸는 로직
      
        const likedButton = document.querySelector(".like-button")
        likedButton.addEventListener("click", (e) => {

          if(e.target.className === "like-button"){
            e.target.setAttribute("class", "liked-button")
            e.target.style.backgroundImage = `url(/powpowcommunity/images/8666647_heart_icon 4_filled_yellow.png)`;
          }else{
            e.target.setAttribute("class", "like-button")
            e.target.style.backgroundImage = `url(/powpowcommunity/images/likebutton.png)`;
          }

        })
      
        
        
        
    </script>
  
  </body>
</html>
